<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>历史档案 · Mimir</title><link rel="stylesheet" href="app.css"></head>
<body><main class="shell"><header class="topbar"><a class="brand" href="dashboard.html"><img src="icon/icon-32x32.ico" alt="">Mimir</a><nav><a href="dashboard.html" aria-current="page">历史档案</a><a href="settings.html">设置与备份</a></nav></header>
<section class="hero"><div class="row"><div><h1>历史档案</h1><p>按日期、关键词或网站查找保存过的页面。</p></div><button id="sync">立即同步</button></div></section>
<div class="status-strip"><span id="captureState">正在连接后台…</span><span>已保存 <strong id="total">—</strong> 条</span><span id="backupState">—</span><span>最后上传 <strong id="lastBackup">—</strong></span></div><p id="statusError" hidden></p>
<section class="card" style="margin-top:22px"><form id="filters" class="filters"><label>开始日期<input type="date" id="start"></label><label>结束日期<input type="date" id="end"></label><label>标题或网址<input id="query" placeholder="搜索历史记录" maxlength="500"></label><label>域名<input id="domain" placeholder="例如 github.com"></label><button class="primary" type="submit">查找</button></form><div class="actions"><button data-range="1">今天</button><button data-range="7">最近 7 天</button><button data-range="30">最近 30 天</button><button data-range="all">全部历史</button><button id="cancelSearch" hidden>取消查询</button><span class="muted" id="searchState"></span></div></section>
<div class="view-tabs"><button id="historyTab" aria-pressed="true" aria-controls="historyPanel">浏览记录</button><button id="analysisTab" aria-pressed="false" aria-controls="analysisPanel">统计与 AI</button><span id="matchedCount" class="muted"></span></div>
<div id="historyPanel"><section class="card"><div class="section-heading"><h2>浏览记录</h2><span class="muted" id="pageLabel"></span></div><div class="table-wrap"><table><thead><tr><th>访问时间</th><th>页面</th><th>域名</th></tr></thead><tbody id="historyRows"></tbody></table></div><p class="empty" id="empty">正在读取…</p><div class="actions"><button id="previous" disabled>上一页</button><button id="next" disabled>下一页</button><small id="legacyNote"></small></div></section>
</div>
<div id="analysisPanel" hidden><section class="metrics" aria-label="所选范围统计"><div class="metric"><strong id="rangeTotal">—</strong><span>访问记录</span></div><div class="metric"><strong id="uniqueUrls">—</strong><span>独立网址</span></div><div class="metric"><strong id="domainCount">—</strong><span>访问域名</span></div><div class="metric"><strong id="activeDays">—</strong><span>有记录的日期</span></div></section>
<section class="card"><div class="split"><div><h2>常访问的网站</h2><div class="chart" id="domainChart"></div></div><div><h2>一天中的活跃时段</h2><div class="hours" id="hourChart"></div><div class="hours-labels"><span>00 时</span><span>06 时</span><span>12 时</span><span>18 时</span><span>23 时</span></div><small>按访问发生的次数统计，不代表实际停留时长。</small></div></div></section>
<section class="card"><div class="section-heading"><h2>分析这段历史</h2><span class="muted" id="sampleLabel">完成统计后可分析</span></div><label for="question" class="muted">留空生成总结，或写下你想了解的问题。</label><textarea id="question" maxlength="2000" placeholder="例如：最近一周，我主要在学习哪些内容？"></textarea><small>仅在点击时发送统计与标题样本；不发送完整网址参数。</small><div class="actions"><button class="primary" id="analyze" disabled>分析所选范围</button><button id="cancelAI" hidden>取消分析</button><button id="exportAI" disabled>导出分析</button></div><pre id="aiOutput" class="output" hidden></pre></section>
</div>
<p id="notice" class="notice" role="status"></p><footer>历史由本地档案提供。自动保存不会随浏览器历史过期而清除。</footer></main><script type="module" src="dashboard.js"></script></body></html>
